<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ダメージ計算ツール</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>ダメージ計算ツール</h1>

    <h2>攻撃側</h2>

    <label>
        攻撃力：
        <input type="number" id="attackPower" value="1" min="0">
    </label>
    <br>
    <label>
        ダメージ加算値：
        <input type="number" id="damageAdd" value="0" min="0">
    </label>

    <h2>防御側</h2>
    <label>
        HP：
        <input type="number" id="hp" value="5" min="0">
    </label>
    <br>
    <label>
        防御力：
        <input type="number" id="defensePower" value="1" min="0">
    </label>
    <br>
    <label>
        ダメージ軽減値：
        <input type="number" id="damageReduce" value="0" min="0">
    </label>

    <br><br>

    <h2>ダメージ表</h2>

    <table id="damageTable">
        <thead>
            <tr>
                <th>攻撃＼防御</th>
                <th>1</th>
                <th>2</th>
                <th>3</th>
                <th>4</th>
                <th>5</th>
                <th>6</th>
            </tr>
        </thead>

        <tbody>
        </tbody>
    </table>

    <p>
        最終ダメージ期待値：
        <span id="expectedDamage">-</span>
    </p>

    <p>
        撃破確率：
        <span id="defeatRate">-</span>
    </p>

    <script src="script.js"></script>

    <script src="script.js"></script>

</body>
</html>

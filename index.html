<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ダメージ計算ツール</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
<h1>ダメージ計算ツール</h1>

<div class="main-container">

    <!-- 左側：パラメータ -->
    <div class="parameter-area">

        <section class="attack-panel">
            <h2>攻撃側</h2>

            <label>
                攻撃：
                <div class="number-control">
                    <button type="button" class="minus-button" data-target="attackPower">−</button>
                    <input type="number" id="attackPower" value="1" min="0">
                    <button type="button" class="plus-button" data-target="attackPower">＋</button>
                </div>
            </label>

            <label>
                加算：
                <div class="number-control">
                    <button type="button" class="minus-button" data-target="damageAdd">−</button>
                    <input type="number" id="damageAdd" value="0" min="0">
                    <button type="button" class="plus-button" data-target="damageAdd">＋</button>
                </div>
            </label>
        </section>


        <section class="defense-panel">
            <h2>防御側</h2>

            <label>
                HP：
                <div class="number-control">
                    <button type="button" class="minus-button" data-target="hp">−</button>
                    <input type="number" id="hp" value="5" min="0">
                    <button type="button" class="plus-button" data-target="hp">＋</button>
                </div>
            </label>

            <label>
                防御：
                <div class="number-control">
                    <button type="button" class="minus-button" data-target="defensePower">−</button>
                    <input type="number" id="defensePower" value="1" min="0">
                    <button type="button" class="plus-button" data-target="defensePower">＋</button>
                </div>
            </label>

<label>
    軽減：
    <div class="number-control">
        <button type="button" class="minus-button" data-target="damageReduce">−</button>
        <input type="number" id="damageReduce" value="0" min="0">
        <button type="button" class="plus-button" data-target="damageReduce">＋</button>
    </div>
</label>
        </section>

    </div>


    <!-- 右側：ダメージ表 -->
    <div class="damage-area">

        <table id="damageTable">
            <thead>
                <tr>
                    <th colspan="2" rowspan="2"></th>
                    <th colspan="6">防御</th>
                </tr>

                <tr>
                    <th>1</th>
                    <th>2</th>
                    <th>3</th>
                    <th>4</th>
                    <th>5</th>
                    <th>6</th>
                </tr>
            </thead>

            <tbody>
            </tbody>
        </table>

        <div class="analysis-values">

            <div>
                <span>最終ダメージ期待値</span>
                <strong id="expectedDamage">-</strong>
            </div>

            <div>
                <span>撃破確率</span>
                <strong id="defeatRate">-</strong>
            </div>

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
